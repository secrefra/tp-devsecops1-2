name: CI/CD - democyber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME1 }}/democyber:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Java
        run: mvn -B compile

      - name: Build Java project with Maven
        run: mvn -B clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME1 }}
          password: ${{ secrets.DOCKERHUB_TOKEN1 }}

      - name: Build Docker image
        run: docker build -t "$DOCKER_IMAGE_NAME" .

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 "$DOCKER_IMAGE_NAME"
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080 | grep -q "Bonjour"; then
              echo "OK : l'application répond"
              docker rm -f democyber-test
              exit 0
            fi
            sleep 2
          done
          echo "ERREUR : l'application ne répond pas"
          docker logs democyber-test
          docker rm -f democyber-test
          exit 1

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push'
        run: docker push "$DOCKER_IMAGE_NAME"